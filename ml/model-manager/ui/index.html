<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOJOO 모델 관리 (로컬)</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f9; --surface:#ffffff; --surface-2:#f3f3f3; --ink:#191919; --ink-2:#666666;
  --line:#e7e7e7; --axis:#c2c2c2; --border:rgba(11,11,11,.12);
  --s1:#257de0; --s2:#f47230; --accent:#257de0; --on-accent:#ffffff;
  --good:#0aac23; --warn:#fbb315; --serious:#f18a59; --crit:#dc3c3d; --good-text:#006c10; --crit-text:#b3261e;
  --heat-strong-ink:#ffffff;
  --seq-1:#e6f1fe; --seq-2:#cce3fd; --seq-3:#9dc8f7; --seq-4:#6aabf1; --seq-5:#338ced; --seq-6:#2370cd; --seq-7:#1757ac; --seq-8:#0e3d7e;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0b0b0b; --surface:#191919; --surface-2:#232323; --ink:#efefef; --ink-2:#9c9c9c;
    --line:#303030; --axis:#474747; --border:rgba(255,255,255,.12);
    --s1:#338ced; --s2:#e76624; --accent:#338ced; --good-text:#53c556; --crit-text:#ff8a80; --heat-strong-ink:#0b0b0b;
    --seq-1:#1d2633; --seq-2:#0e3d7e; --seq-3:#0f4a96; --seq-4:#1757ac; --seq-5:#2370cd; --seq-6:#338ced; --seq-7:#6aabf1; --seq-8:#9dc8f7;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b0b0b; --surface:#191919; --surface-2:#232323; --ink:#efefef; --ink-2:#9c9c9c;
  --line:#303030; --axis:#474747; --border:rgba(255,255,255,.12);
  --s1:#338ced; --s2:#e76624; --accent:#338ced; --good-text:#53c556; --crit-text:#ff8a80; --heat-strong-ink:#0b0b0b;
  --seq-1:#1d2633; --seq-2:#0e3d7e; --seq-3:#0f4a96; --seq-4:#1757ac; --seq-5:#2370cd; --seq-6:#338ced; --seq-7:#6aabf1; --seq-8:#9dc8f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .sub{color:var(--ink-2);font-size:12px}
header .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
main>*{min-width:0;max-width:100%}
section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13px;color:var(--ink-2);margin:14px 0 6px;font-weight:600}
button,.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--crit-text)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.err{color:var(--crit-text)}
.ok{color:var(--good-text)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--ink-2);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-2);font-size:12px}
.kpi .d{font-size:12px;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid var(--border);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{font-style:normal;display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;color:#fff}
.st.ok i{background:var(--good)} .st.warn i{background:var(--warn);color:#0b0b0b} .st.info i{background:var(--accent)} .st.untrained i{background:var(--axis)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 12px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink-2)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>*{min-width:0} /* 넓은 표·차트가 열 폭을 밀어내지 않게 */
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border-radius:6px;padding:4px 8px;font-size:12px}
.chip b{font-variant-numeric:tabular-nums}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;border-radius:6px;overflow:hidden;background:var(--surface-2);border:2px solid transparent;cursor:pointer}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel{border-color:var(--accent)}
.tile .chk{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:4px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.drop{border:2px dashed var(--axis);border-radius:8px;padding:18px;text-align:center;color:var(--ink-2)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-2);font-size:11px}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;display:none;z-index:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:4px 0 6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.box{height:10px;width:10px;border-radius:2px}
.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat td{width:44px;height:30px;text-align:center;border:none;border-radius:4px;padding:0;font-variant-numeric:tabular-nums}
.heat th{font-weight:500;font-size:11px;padding:2px 4px;border:none;white-space:nowrap}
.heat th.rowh{text-align:right}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal>div{background:var(--surface);border-radius:10px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.empty{color:var(--ink-2);padding:12px 0}
.reasons{margin:6px 0 0;padding-left:18px}
.reasons li{margin:2px 0}
@media (max-width:600px){main{padding:12px 16px}.kpi .v{font-size:19px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧠 모델 관리 <span class="badge">이 PC</span></h1>
    <div class="sub">학습 사진·라벨 · 로컬 학습 · 성능 → 서버 배포 · GitHub</div>
  </div>
  <div class="sp"></div>
  <span id="jobsBadge" class="small muted"></span>
  <span id="srvBadge" class="small"></span>
  <button onclick="settingsDialog()">설정</button>
  <button onclick="route()">새로고침</button>
</header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<div id="modalRoot"></div>

<script>
'use strict';
// ---------- 공통 ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (v, d = 0) => (v == null || Number.isNaN(v) ? '—' : `${(v * 100).toFixed(d)}%`);
const fmtDate = (s) => (s ? String(s).slice(0, 16).replace('T', ' ') : '—');
// 로컬 서버(127.0.0.1) 전용 — 쓰기 요청은 x-mm-local 헤더가 있어야 받는다 (다른 사이트의 요청 위조 차단)
async function api(path, opts = {}) {
  const headers = { 'x-mm-local': '1', ...(opts.headers || {}) };
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function setServerBadge(reachable, url, error) {
  const el = $('#srvBadge');
  if (!el) return;
  el.innerHTML = reachable
    ? `<span class="st ok"><i aria-hidden="true">✓</i>서버 연결됨</span>`
    : `<span class="st warn" title="${esc(error || '')}"><i aria-hidden="true">!</i>서버 연결 안 됨</span>`;
  el.title = url || '';
}

async function settingsDialog() {
  const c = await api('/api/config');
  openModal(`<h2>설정</h2>
    <p class="muted small">이 PC 에만 저장됩니다 (ml/model-manager/.local — GitHub 에 올라가지 않음).</p>
    <label class="f">서버 주소<input id="cfUrl" value="${esc(c.serverUrl)}" placeholder="http://34.50.40.104:4000"></label>
    <label class="f" style="margin-top:8px">업로드 토큰 (서버 MODEL_MANAGER_TOKEN)<input id="cfToken" type="password" placeholder="${c.hasToken ? '설정됨 — 바꿀 때만 입력' : '없음'}"></label>
    <div class="row" style="margin-top:8px">
      <label class="f">GitHub 커밋 이름<input id="cfGitName" value="${esc(c.gitName)}" placeholder="git 설정 사용"></label>
      <label class="f">GitHub 커밋 이메일<input id="cfGitEmail" value="${esc(c.gitEmail)}" placeholder="git 설정 사용"></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button onclick="closeModal()">취소</button><button class="primary" onclick="saveSettings()">저장</button></div>`);
}
async function saveSettings() {
  try {
    await api('/api/config', { method: 'PUT', json: { serverUrl: $('#cfUrl').value, token: $('#cfToken').value, gitName: $('#cfGitName').value, gitEmail: $('#cfGitEmail').value } });
    closeModal(); toast('설정을 저장했어요'); route();
  } catch (e) { toast(e.message); }
}

async function publishGithub(models) {
  const msg = prompt('GitHub 커밋 메시지', models.length === 1 ? `model(${models[0]}): 라벨·학습 사진·버전 갱신` : `model-manager: ${models.length}개 모델 갱신`);
  if (msg == null) return;
  toast('GitHub 에 올리는 중…', 4000);
  try {
    const r = await api('/api/github/publish', { method: 'POST', json: { models, message: msg } });
    toast(r.commit ? `커밋 ${r.commit} (${r.files}개 파일) → ${r.branch} push 완료` : `바뀐 파일 없음 — ${r.branch} push 확인`, 5000);
    route();
  } catch (e) { toast(e.message, 6000); }
}

function toast(msg, ms = 2600) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

const STATUS = {
  ok: ['ok', '✓', '정상'],
  info: ['info', 'i', '학습 가능'],
  warn: ['warn', '!', '재학습 권장'],
  untrained: ['untrained', '○', '미학습'],
};
const statusHtml = (s) => { const [c, i, t] = STATUS[s] || STATUS.untrained; return `<span class="st ${c}"><i aria-hidden="true">${i}</i>${t}</span>`; };

function reasonText(r) {
  switch (r.code) {
    case 'confidence_drop': return `현장 평균 신뢰도 하락 ${pct(r.from)} → ${pct(r.to)} (최근 7일 vs 그 전 7일)`;
    case 'low_confidence': return `신뢰도 60% 미만 판독이 ${pct(r.rate)} (최근 7일)`;
    case 'unseen_accuracy': return `배포 뒤 추가된 사진 ${r.n}장에서 정확도 ${pct(r.accuracy)}`;
    case 'human_disagreement': return `사람이 확정한 진단과 일치율 ${pct(r.agreement)} (${r.n}건)`;
    case 'new_samples': return `학습에 쓰지 않은 새 사진 ${r.n}장 — 재학습하면 반영됩니다`;
    case 'new_labels': return `아직 학습되지 않은 라벨: ${r.labels.map((l) => (window.__labelName ? window.__labelName(l) : l)).join(', ')}`;
    case 'no_version': return '아직 학습된 버전이 없습니다 — 사진을 넣고 학습하세요';
    case 'newer_than_server': return `로컬 v${r.version} 이 서버 배포 버전(v${r.server})보다 새롭습니다 — 지표를 확인하고 업로드·배포하세요`;
    default: return r.code;
  }
}
const KIND = { detector: '검출 모듈', species: '식물 종' };
// 종 모델의 현장 판독은 관수 모듈 결과(dry/ok/wet)라 라벨 이름이 따로다
const WATER_LABELS = { dry: '물 부족', ok: '적정', wet: '물 과다' };
const fieldLabelName = (lid) => (cur?.detail.model.kind === 'species' ? WATER_LABELS[lid] || lid : window.__labelName(lid));
const SOURCE = { bundled: '앱 내장', trained: '로컬 학습' };
const DATASET = { synthetic: '합성 이미지', samples: '실사진' };
const SPLIT = { train: '학습', val: '검증' };

// ---------- 라우팅 ----------
let pollTimer = null;
window.addEventListener('hashchange', route);
function route() {
  clearTimeout(pollTimer);
  const m = location.hash.match(/^#\/model\/([a-z0-9_]+)(?:\/(\w+))?/);
  if (m) showModel(m[1], m[2] || 'perf'); else showList();
}

// ---------- 모델 목록 ----------
async function showList() {
  const app = $('#app');
  let data;
  try { data = await api('/api/models'); } catch (e) { app.innerHTML = `<section class="err">${esc(e.message)}</section>`; return; }
  updateJobs(data.jobs);
  setServerBadge(data.server.reachable, data.server.url, data.server.error);
  let git = null;
  try { git = await api('/api/github/status'); } catch { /* git 없음 */ }
  const changed = git ? Object.entries(git.models).filter(([, s]) => s.changed || s.unpushed).map(([id]) => id) : [];
  const warn = data.models.filter((m) => m.health.status === 'warn').length;
  const rows = (kind) => data.models.filter((m) => m.kind === kind).map((m) => {
    const f = m.field?.recent;
    const g = git?.models[m.id];
    return `<tr class="click" onclick="location.hash='#/model/${m.id}'">
      <td style="min-width:150px">${esc(m.icon || '')} <b>${esc(m.name)}</b> <span class="muted small">${esc(m.id)}</span></td>
      <td class="num">${m.latestVersion ? `v${m.latestVersion}` : '—'}</td>
      <td class="num">${m.serverVersion ? `v${m.serverVersion}` : `<span class="muted">${data.server.reachable ? '없음' : '?'}</span>`}</td>
      <td class="num">${pct(m.accuracy)} <span class="muted small">${m.metricsDataset ? DATASET[m.metricsDataset] : ''}</span></td>
      <td class="num">${pct(m.unseenAccuracy)}</td>
      <td class="num">${f?.n ? `${pct(f.avgConfidence)} <span class="muted small">${f.n}건</span>` : '<span class="muted">—</span>'}</td>
      <td class="num">${m.samples}</td>
      <td class="num">${m.usage ?? '—'}</td>
      <td class="small">${g ? (g.changed ? `변경 ${g.changed}` : g.unpushed ? 'push 전' : '✓') : ''}</td>
      <td>${statusHtml(m.health.status)}</td></tr>`;
  }).join('');
  const head = `<tr><th>모델</th><th class="num">로컬 최신</th><th class="num">서버 배포</th><th class="num">검증 정확도</th><th class="num">새 사진 정확도</th><th class="num">현장 신뢰도(7일)</th><th class="num">학습 사진</th><th class="num">사용 식물</th><th>GitHub</th><th>상태</th></tr>`;
  app.innerHTML = `
    <section>
      <div class="row"><h2 style="margin:0">모델 ${data.models.length}개</h2><span class="sp" style="flex:1"></span>
        ${warn ? `<span class="st warn"><i>!</i>재학습 권장 ${warn}개</span>` : ''}
        ${changed.length ? `<button onclick='publishGithub(${esc(JSON.stringify(changed))})'>⬆ GitHub 에 올리기 (${changed.length}개 모델)</button>` : ''}
        <button class="primary" onclick="newModelDialog()">＋ 새 모델</button></div>
      <p class="muted small" style="margin:6px 0 0">학습은 이 PC 에서 하고, 결과(모델·라벨·학습/검증 사진·지표)는 <code>ml/registry/</code> 에 저장됩니다. 버전을 서버에 업로드·배포하면 Farmer 가 받고, GitHub 에 올리면 저장소에 남습니다.
        현장 신뢰도·사용 식물·모델 없는 종은 서버에서 가져옵니다${data.server.reachable ? '' : ' — 지금은 서버에 연결되지 않았습니다'}.</p>
    </section>
    ${data.unmatchedSpecies.length ? `<section><h2>모델이 없는 식물 종</h2>
      <p class="muted small" style="margin-top:0">이 종의 식물은 관수 모듈이 잎 색으로만 추정합니다. 종 모델을 만들고 사진을 넣어 학습하세요.</p>
      <div class="chips">${data.unmatchedSpecies.map((u) => `<button onclick="newModelDialog(${esc(JSON.stringify({ kind: 'species', name: u.raw }))})">🌱 ${esc(u.raw)} <span class="muted">· 식물 ${u.plants}</span></button>`).join('')}</div></section>` : ''}
    <section><h2>검출 모듈</h2><div class="tablewrap"><table>${head}${rows('detector')}</table></div></section>
    <section><h2>식물 종 모델 <span class="muted small">— 관수 주기 모듈이 종에 맞춰 사용</span></h2><div class="tablewrap"><table>${head}${rows('species')}</table></div></section>`;
}

function updateJobs(jobs) {
  const run = (jobs || []).filter((j) => j.status === 'running');
  $('#jobsBadge').textContent = run.length ? `⏳ 학습 중: ${run.map((j) => j.modelId).join(', ')}` : '';
}

// ---------- 새 모델 ----------
function newModelDialog(pre = {}) {
  const kind = pre.kind || 'species';
  openModal(`
    <h2>새 모델</h2>
    <div class="row" style="margin-bottom:10px">

}
function nmKind() {

async function nmSubmit() {

let cur = null; // { detail, tab, perfVersion }

        ${d.server.reachable ? `<span>· 사용 식물 <b>${d.server.usage}</b></span>` : ''}
        ${d.git && !d.git.error ? `<span class="muted">· GitHub: ${d.git.changed ? `올리지 않은 변경 ${d.git.changed}개` : d.git.unpushed ? 'push 전 커밋 있음' : '최신'}</span>` : ''}
        ${m.kind === 'species' ? `<span class="muted">· 종 이름: ${esc((m.aliases || []).join(', '))}</span>` : ''}
        ${m.baseModel ? `<span class="muted">· 기반 모델 ${esc(m.baseModel)}</span>` : ''}
      </div>
      ${d.health.reasons.length ? `<ul class="reasons small">${d.health.reasons.map((r) => `<li class="${r.level === 'warn' ? 'err' : ''}">${esc(reasonText(r))}</li>`).join('')}</ul>` : ''}
    </section>
    <section>
      <div class="tabs" role="tablist">
        ${[['perf', '성능'], ['data', '학습 데이터'], ['train', '학습·배포']].map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" onclick="location.hash='#/model/${m.id}/${k}'">${t}</button>`).join('')}
      </div>
      <div id="tab"></div>
    </section>`;
  if (tab === 'data') renderData(); else if (tab === 'train') renderTrain(); else renderPerf();
  const live = d.jobs.find((j) => j.status === 'queued' || j.status === 'running');
  if (live) pollJob(live.id);
}

// ---------- 성능 ----------
function renderPerf() {
  const d = cur.detail;
  const v = d.versions.find((x) => x.version === cur.perfVersion) || d.versions[0];
  const empty = { recent: { n: 0, avgConfidence: null, lowRate: null }, previous: { n: 0, avgConfidence: null }, daily: [], byVersion: [], labels: [] };
  const f = d.server.field || empty;
  d.agreement = d.server.agreement;
  // 성능의 기준 버전: 서버에 배포된 버전 (로컬에 있으면), 없으면 로컬 최신
  const active = d.versions.find((x) => x.version === d.server.activeVersion) || d.versions[0];
  const ev = active?.eval;
  const dConf = f.recent.avgConfidence != null && f.previous.avgConfidence != null ? f.recent.avgConfidence - f.previous.avgConfidence : null;

      <div class="kpi"><div class="l">새 사진 정확도</div><div class="v">${pct(ev?.unseen?.accuracy)}</div><div class="d">${ev ? `배포 뒤 추가된 ${ev.unseen?.n ?? 0}장 · ${fmtDate(ev.at)} 평가` : '학습 탭에서 \'다시 평가\''}</div></div>
      <div class="kpi"><div class="l">현장 평균 신뢰도 (7일)</div><div class="v">${pct(f.recent.avgConfidence)}</div><div class="d">${f.recent.n}건${dConf != null ? ` · 그 전 7일 대비 ${dConf >= 0 ? '▲' : '▼'} ${Math.abs(dConf * 100).toFixed(0)}%p` : ''}</div></div>
      <div class="kpi"><div class="l">신뢰도 60% 미만 (7일)</div><div class="v">${pct(f.recent.lowRate)}</div><div class="d">낮을수록 좋음</div></div>
      ${d.agreement ? `<div class="kpi"><div class="l">사람 확인 일치율 (90일)</div><div class="v">${pct(d.agreement.agreement)}</div><div class="d">영상 진단 확정 ${d.agreement.n}건</div></div>` : ''}
    </div>

    <h3>현장 판독 신뢰도 — 최근 30일</h3>
    <p class="muted small" style="margin:0 0 4px">Farmer가 이 모델로 판독해 보낸 결과의 하루 평균 신뢰도와, 신뢰도 60% 미만 판독의 비율입니다.</p>
    <div id="trend"></div>

    <div class="grid2" style="margin-top:6px">
      <div>
        <h3>라벨별 재현율 — <select id="pv" onchange="cur.perfVersion=Number(this.value);renderPerf()">${d.versions.map((x) => `<option value="${x.version}" ${x.version === v?.version ? 'selected' : ''}>v${x.version} ${SOURCE[x.source]}${x.server.active ? ' (서버 배포 중)' : ''}</option>`).join('')}</select></h3>
        <p class="muted small" style="margin:0 0 4px">${v?.metrics ? `${DATASET[v.metrics.dataset] || ''} 검증 ${v.metrics.n}장${v.baseline ? ` — 같은 사진에서 ${v.baseline.from?.modelId !== d.model.id ? esc(v.baseline.from?.modelId) + ' ' : ''}v${v.baseline.from?.version}와 비교` : ''}` : '이 버전은 검증 사진이 없어 지표가 없습니다'}</p>

// 날짜별 선 차트: 평균 신뢰도(파랑) + 60% 미만 비율(주황), 0~100% 한 축
function trendChart(el, daily) {
  if (!daily.length) { el.innerHTML = '<div class="empty">아직 현장 판독이 없습니다</div>'; return; }
  const days = [];
  const end = new Date(daily[daily.length - 1].day + 'T00:00:00Z');
  const start = new Date(Math.min(new Date(daily[0].day + 'T00:00:00Z'), end - 13 * 864e5));
  for (let t = +start; t <= +end; t += 864e5) days.push(new Date(t).toISOString().slice(0, 10));
  const byDay = new Map(daily.map((d) => [d.day, d]));
  const W = Math.max(320, Math.round(el.clientWidth || 720)); const H = 220; const L = 40; const R = 128; const T = 10; const B = 26;
  const x = (i) => L + (days.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (days.length - 1));
  const y = (v) => T + (1 - v) * (H - T - B);
  const series = [
    { key: 'avgConfidence', name: '평균 신뢰도', color: 'var(--s1)' },
    { key: 'lowRate', name: '60% 미만 비율', color: 'var(--s2)' },
  ];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="일별 평균 신뢰도와 저신뢰 비율">`;
  for (const g of [0, 0.25, 0.5, 0.75, 1]) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g * 100}%</text>`;
  }
  const tickEvery = Math.ceil(days.length / 6);
  days.forEach((dd, i) => { if (i % tickEvery === 0 || i === days.length - 1) svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${dd.slice(5).replace('-', '.')}</text>`; });
  const ends = [];
  for (const s of series) {
    let path = ''; let pen = false; let last = null;
    days.forEach((dd, i) => {
      const r = byDay.get(dd); const v = r?.[s.key];
      if (v == null) { pen = false; return; }
      path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; last = { i, v };
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${days.length > 20 ? 2.5 : 4}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if (last) ends.push({ x: x(last.i) + 8, y: y(last.v) + 4, text: `${s.name} ${pct(last.v)}` });
  }
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  for (const e of ends) svg += `<text x="${e.x}" y="${e.y}" style="fill:var(--ink)">${esc(e.text)}</text>`;
  svg += `<line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  svg += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg>`;
  el.innerHTML = `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}<span style="flex:1"></span><button class="small" id="tt">표로 보기</button></div><div class="chart">${svg}<div class="tip"></div></div><div class="tbl" style="display:none"></div>`;
  const chart = $('.chart', el); const tip = $('.tip', el); const hit = $('#hit', el); const xh = $('#xh', el); const svgEl = $('svg', el);
  hit.addEventListener('mousemove', (e) => {
    const r = svgEl.getBoundingClientRect(); const sx = ((e.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((sx - L) / (W - L - R)) * (days.length - 1))));
    const d = byDay.get(days[i]);
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${days[i]}</b><br>${d ? `평균 신뢰도 ${pct(d.avgConfidence)}<br>60% 미만 ${pct(d.lowRate)}<br>판독 ${d.n}건` : '판독 없음'}`;
    tip.style.display = 'block';
    const px = (x(i) / W) * r.width;
    tip.style.left = `${Math.min(px + 12, r.width - tip.offsetWidth)}px`; tip.style.top = '8px';
  });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
  $('#tt', el).onclick = () => {
    const t = $('.tbl', el); const show = t.style.display === 'none';
    t.style.display = show ? '' : 'none'; chart.style.display = show ? 'none' : '';
    $('#tt', el).textContent = show ? '그래프로 보기' : '표로 보기';
    t.innerHTML = `<div class="tablewrap"><table><tr><th>날짜</th><th class="num">판독</th><th class="num">평균 신뢰도</th><th class="num">60% 미만</th></tr>${daily.map((d) => `<tr><td>${d.day}</td><td class="num">${d.n}</td><td class="num">${pct(d.avgConfidence)}</td><td class="num">${pct(d.lowRate)}</td></tr>`).join('')}</table></div>`;
  };
}

// 라벨별 재현율: 이 버전(파랑) vs 같은 검증 사진에서 이전 버전(주황) — 가로 막대, 값은 막대 끝
function recallChart(el, v) {
  const mt = v?.metrics;
  if (!mt) { el.innerHTML = '<div class="empty">지표 없음</div>'; return; }
  const base = v.baseline;
  const rows = mt.perClass;
  const series = [{ name: `v${v.version}`, color: 'var(--s1)', get: (lab) => rows.find((c) => c.label === lab) }];
  if (base) series.push({ name: `이전 v${base.from?.version}`, color: 'var(--s2)', get: (lab) => base.perClass.find((c) => c.label === lab) });
  const W = Math.max(300, Math.round(el.clientWidth || 460)); const bh = 12; const gap = 2; const groupH = series.length * bh + (series.length - 1) * gap + 14; const L = 96; const R = 44;
  const H = rows.length * groupH + 6;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="라벨별 재현율">`;
  rows.forEach((c, gi) => {
    const y0 = gi * groupH + 4;
    svg += `<text x="${L - 8}" y="${y0 + (series.length * (bh + gap)) / 2 + 3}" text-anchor="end" style="fill:var(--ink)">${esc(window.__labelName(c.label))}</text>`;
    series.forEach((s, si) => {
      const r = s.get(c.label); const val = r?.recall; const y = y0 + si * (bh + gap);
      const w = val == null ? 0 : Math.max(val * (W - L - R), val > 0 ? 2 : 0);
      if (w > 0) {
        const rr = Math.min(4, w / 2);
        svg += `<path d="M${L},${y}h${w - rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${bh - 2 * rr}a${rr},${rr} 0 0 1 -${rr},${rr}h-${w - rr}z" fill="${s.color}"><title>${s.name} · ${esc(window.__labelName(c.label))}: ${pct(val)} (검증 ${r?.support ?? 0}장)</title></path>`;
      }
      svg += `<text x="${L + w + 4}" y="${y + bh - 2}">${val == null ? '사진 없음' : pct(val)}</text>`;
    });
  });
  svg += `<line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="var(--axis)"/></svg>`;
  el.innerHTML = `<div class="legend">${series.map((s) => `<span><i class="box" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div><div class="chart">${svg}</div>
    <div class="tablewrap"><table class="small"><tr><th>라벨</th><th class="num">검증</th><th class="num">정밀도</th><th class="num">재현율</th><th class="num">F1</th></tr>
    ${rows.map((c) => `<tr><td>${esc(window.__labelName(c.label))}</td><td class="num">${c.support}</td><td class="num">${pct(c.precision)}</td><td class="num">${pct(c.recall)}</td><td class="num">${pct(c.f1)}</td></tr>`).join('')}
    <tr><td><b>전체</b></td><td class="num">${mt.n}</td><td></td><td class="num"><b>${pct(mt.accuracy)}</b> 정확도</td><td class="num">${pct(mt.macroF1)}</td></tr></table></div>`;
}

function confusionTable(el, mt) {
  if (!mt?.confusion) { el.innerHTML = '<div class="empty">지표 없음</div>'; return; }
  const steps = ['--seq-1', '--seq-2', '--seq-3', '--seq-4', '--seq-5', '--seq-6', '--seq-7', '--seq-8'];
  const short = (lid) => { const n = window.__labelName(lid); return n.length > 6 ? n.slice(0, 6) + '…' : n; };
  let html = `<table class="heat"><tr><th></th>${mt.labels.map((l) => `<th title="${esc(window.__labelName(l))}">${esc(short(l))}</th>`).join('')}</tr>`;
  mt.confusion.forEach((row, i) => {
    const sum = row.reduce((a, b) => a + b, 0);
    html += `<tr><th class="rowh" title="${esc(window.__labelName(mt.labels[i]))}">${esc(short(mt.labels[i]))}</th>`;
    row.forEach((n, j) => {
      const share = sum ? n / sum : 0;
      const k = n === 0 ? 0 : Math.min(7, 1 + Math.floor(share * 7));
      const strong = k >= 5;
      html += `<td style="background:var(${steps[k]});color:${strong ? 'var(--heat-strong-ink)' : 'var(--ink)'};${i === j ? 'outline:1px solid var(--axis)' : ''}" title="실제 ${esc(window.__labelName(mt.labels[i]))} → 판독 ${esc(window.__labelName(mt.labels[j]))}: ${n}장 (${pct(share)})">${n}</td>`;
    });
    html += '</tr>';
  });
  el.innerHTML = html + '</table>';
}

async function addLabel() {
  try {
    await api(`/api/models/${cur.detail.model.id}/labels`, { method: 'POST', json: { id: $('#nlId').value.trim(), ko: $('#nlKo').value.trim(), en: $('#nlEn').value.trim() } });
    toast('라벨을 추가했어요'); route();
  } catch (e) { toast(e.message); }
}

async function upload(files) {
  const list = [...files];
  if (!list.length) return;
  const fd = new FormData();
  fd.append('label', $('#upLabel').value);
  if ($('#upNote').value.trim()) fd.append('note', $('#upNote').value.trim());
  list.slice(0, 40).forEach((f) => fd.append('photos', f, f.name));
  $('#upMsg').textContent = `${list.length}장 올리는 중…`;
  try {
    const r = await api(`/api/models/${cur.detail.model.id}/samples`, { method: 'POST', body: fd });
    $('#upMsg').innerHTML = `<span class="ok">${r.added}장 추가</span>${r.duplicates ? ` · 같은 사진 ${r.duplicates}장은 건너뜀` : ''}${r.rejected.length ? ` · <span class="err">${r.rejected.length}장 제외: ${esc(r.rejected.map((x) => `${x.name} (${x.error})`).join(', '))}</span>` : ''}`;
    dataState.label = $('#upLabel').value;
    const d = await api(`/api/models/${cur.detail.model.id}`); cur.detail = d;
    loadGallery();
  } catch (e) { $('#upMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

async function loadCandidates() {
  const box = $('#cPhotos');
  if (!dataState.plantId) { box.innerHTML = ''; return; }
  const m = cur.detail.model;
  const c = await api(`/api/models/${m.id}/candidates?plantId=${encodeURIComponent(dataState.plantId)}`);
  if (!c.photos.length) { box.innerHTML = '<div class="muted small">이 식물의 Farmer 사진이 없습니다</div>'; return; }
  box.innerHTML = `<div class="gallery">${c.photos.map((p) => `<div class="tile ${dataState.selected.has(p.id) ? 'sel' : ''}" data-id="${p.id}"><img loading="lazy" src="${esc(p.thumbUrl)}" alt=""><span class="chk">${dataState.selected.has(p.id) ? '✓' : ''}</span><div class="cap">${p.importedAs ? '✓ ' + esc(window.__labelName(p.importedAs)) : esc(fmtDate(p.takenAt).slice(5))}</div></div>`).join('')}</div>
    <div class="row" style="margin-top:8px"><span class="small"><b id="cSel">${dataState.selected.size}</b>장 선택</span><select id="cLabel">${m.labels.map((l) => `<option value="${l.id}">${esc(l.ko)}</option>`).join('')}</select><button class="primary" onclick="importPhotos()">이 라벨로 가져오기</button></div>`;
  box.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', () => {
    const id = t.dataset.id;
    if (dataState.selected.has(id)) dataState.selected.delete(id); else dataState.selected.add(id);
    t.classList.toggle('sel'); $('.chk', t).textContent = dataState.selected.has(id) ? '✓' : '';
    $('#cSel').textContent = dataState.selected.size;
  }));
}

async function importPhotos() {
  if (!dataState.selected.size) { toast('사진을 골라 주세요'); return; }
  const label = $('#cLabel').value;
  try {
    toast('서버에서 사진을 받아 RoI 로 자르는 중…');
    const r = await api(`/api/models/${cur.detail.model.id}/samples/import`, { method: 'POST', json: { plantId: dataState.plantId, photos: [...dataState.selected].map((photoId) => ({ photoId, label })) } });

async function loadGallery() {
  const m = cur.detail.model;
  const q = new URLSearchParams({ limit: 48, offset: dataState.offset });

        <td style="white-space:nowrap">${actions(v)}</td></tr>`).join('')}
    </table></div>
    <p class="small muted">서버 업로드: 모델 파일 + 라벨 + 지표 + 그 버전의 학습·검증 사진(서버에 없는 것만)을 올립니다. 배포하면 Farmer 들에게 바로 재동기화 명령이 가서 새 모델을 내려받아(sha256 검증) 씁니다. 롤백은 이전 버전 배포입니다.</p>`;
  if (live) pollJob(live.id);
}

async function uploadVersion(version, activateNow) {
  if (activateNow && !confirm(`v${version}을(를) 서버에 올리고 바로 배포할까요? Farmer들이 이 모델을 내려받아 판독에 씁니다.`)) return;
  toast('서버에 올리는 중…', 4000);
  try {
    const r = await api(`/api/models/${cur.detail.model.id}/versions/${version}/upload`, { method: 'POST', json: { activate: activateNow } });
    toast(`v${r.version} ${r.status === 'exists' ? '이미 서버에 있음' : '업로드'} · 사진 ${r.uploadedPhotos}/${r.datasetSize}장 전송${r.activated ? ` · 배포 (Farmer ${r.activated.notified}대 알림)` : ''}`, 5000);
    route();
  } catch (e) { toast(e.message, 6000); }
}

function jobSummary(j) {
  if (j.status === 'failed') return j.message || '';
  if (j.status !== 'done') return j.message || '';
  const r = j.result || {};
  if (j.type === 'train') return `v${r.version} · 검증 ${pct(r.accuracy)}${r.baselineAccuracy != null ? ` (이전 ${pct(r.baselineAccuracy)})` : ''} · ${r.nTrain}/${r.nVal}장 · ${r.seconds}초`;
  return `v${r.version} · 새 사진 ${pct(r.unseenAccuracy)} · 전체 ${pct(r.allAccuracy)} (${r.n}장)`;
}

async function startTrain() {
  const fromVal = $('#tFrom').value;
  const body = { from: fromVal === 'base' ? 'base' : Number(fromVal), epochs: Number($('#tEpochs').value), lr: Number($('#tLr').value) };
  try { const r = await api(`/api/models/${cur.detail.model.id}/train`, { method: 'POST', json: body }); $('#tGo').disabled = true; pollJob(r.jobId); } catch (e) { toast(e.message, 4000); }
}
async function startEval() {
  try { const r = await api(`/api/models/${cur.detail.model.id}/evaluate`, { method: 'POST', json: { version: cur.perfVersion ?? cur.detail.versions[0]?.version } }); pollJob(r.jobId); } catch (e) { toast(e.message, 4000); }
}
async function pollJob(id) {
  clearTimeout(pollTimer);
  let j;
  try { j = await api(`/api/jobs/${id}`); } catch { return; }
  const box = $('#job');
  if (box) box.innerHTML = `<div class="small">${j.type === 'train' ? '학습' : '평가'} ${{ queued: '대기 중', running: '진행 중', done: '완료', failed: '실패' }[j.status]} — ${esc(j.status === 'done' ? jobSummary(j) : j.message || '')}</div><div class="progress" role="progressbar" aria-valuenow="${Math.round(j.progress * 100)}"><div style="width:${Math.round(j.progress * 100)}%"></div></div>`;
  $('#jobsBadge').textContent = j.status === 'running' ? `⏳ ${j.modelId} ${j.type === 'train' ? '학습' : '평가'} ${Math.round(j.progress * 100)}%` : '';
  if (j.status === 'queued' || j.status === 'running') { pollTimer = setTimeout(() => pollJob(id), 1000); return; }
  if (j.status === 'done') toast(j.type === 'train' ? `v${j.result.version} 학습 완료 — 지표를 확인하고 서버에 업로드하세요` : '평가 완료');
  else toast(`실패: ${j.message}`, 5000);
  if (cur && cur.detail.model.id === j.modelId) {
    cur.detail = await api(`/api/models/${j.modelId}`);
    if (cur.tab === 'train') renderTrain(); else if (cur.tab === 'perf') renderPerf();
  }
}
async function activate(version) {
  if (!confirm(`서버에서 v${version}을(를) 배포할까요? Farmer들이 이 모델을 내려받아 판독에 씁니다.`)) return;
  try { const r = await api(`/api/models/${cur.detail.model.id}/versions/${version}/activate`, { method: 'POST', json: {} }); toast(`v${r.version} 배포 — Farmer ${r.notified}대에 알림`); route(); } catch (e) { toast(e.message, 5000); }
}

let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (cur && cur.tab === 'perf' && $('#trend')) renderPerf(); }, 200); });
route();
</script>
</body>
</html>
